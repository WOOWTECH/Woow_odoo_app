name: Brand build and unit contracts (no publishing)

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - brand: woowtech
            variant: woowtechDebug
            task: WoowtechDebug
          - brand: apporo
            variant: apporoDebug
            task: ApporoDebug
    steps:
      - uses: actions/checkout@v4
        with:
          # Offline contracts compare protected sources against baseline 73ad528.
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Offline brand contracts
        run: python3 -B -m unittest discover -s scripts/tests -p 'test_brand*.py' -v
      - name: Inject approved Apporo client configuration (missing means BLOCKED)
        if: matrix.brand == 'apporo'
        env:
          CLIENT_CONFIG: ${{ secrets.APPORO_DEBUG_GOOGLE_SERVICES_JSON }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          value = os.environ.get("CLIENT_CONFIG", "")
          if not value:
              raise SystemExit("BLOCKED: approved Apporo Firebase client configuration is required")
          path = Path("app/src/apporoDebug/google-services.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(value)
          PY
      - name: Build and unit tests for the selected flavor
        run: ./gradlew :app:assemble${{ matrix.task }} :app:test${{ matrix.task }}UnitTest --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.variant }}-candidate-unverified-on-device
          path: |
            app/build/outputs/apk/${{ matrix.brand }}/debug/*.apk
            app/build/test-results/test${{ matrix.task }}UnitTest/*.xml
          if-no-files-found: error
          retention-days: 14
